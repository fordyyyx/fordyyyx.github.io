<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>William Ford</title>
  <link href="styles.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
  <header class="header-bar">
    <h1 class="home-title">Will Ford</h1>
    <img src="./assets/white-logo.png" class="main-logo-img" />
  </header>

  <div class="section-container">
    <div class="sports-section-label main-label-div">
      <h2 class="section-title">Sports</h2>
      <h3 class="section-subtitle">Passionate Athlete</h3>
    </div>
    <div class="sports-div links-container">
      <div class='main-link-div' id="running-div">
        <h2 class="main-link-title">Running</h2>
      </div>
      <div class="main-link-div" id="cycling-div">
        <h2 class="main-link-title">Cycling</h2>
      </div>
      <div class="main-link-div" id="football-div">
        <h2 class="main-link-title">Football</h2>
      </div>
    </div>

    <div class="work-section-label main-label-div">
      <h2 class="section-title">Work</h2>
      <h3 class="section-subtitle">Nine to Five</h3>
    </div>
    <div class="work-div links-container">
      <div class="main-link-div" id="experience-div">
        <h2 class="main-link-title">Experience</h2>
      </div>
      <div class="main-link-div" id="pdp-div">
        <h2 class="main-link-title">PDP</h2>
      </div>
      <div class="main-link-div" id="education-div">
        <h2 class="main-link-title">Education</h2>
      </div>
    </div>

    <div class="programming-section-label main-label-div">
      <h2 class="section-title">Programming</h2>
      <h3 class="section-subtitle">Coding and Development</h3>
    </div>
    <div class="programming-div links-container">
      <div class="main-link-div" id="web-design-div">
        <h2 class="main-link-title">Web Design</h2>
      </div>
      <div class="main-link-div" id="python-div">
        <h2 class="main-link-title">Python</h2>
      </div>
      <div class="main-link-div" id="game-development-div">
        <h2 class="main-link-title">Game Development</h2>
      </div>
    </div>

    <div class="hobbies-section-label main-label-div">
      <h2 class="section-title">Hobbies</h2>
      <h3 class="section-subtitle">Fun and Interests</h3>
    </div>
    <div class="hobbies-div links-container">
      <div class="main-link-div" id="gaming-div">
        <h2 class="main-link-title">Gaming</h2>
      </div>
      <div class="main-link-div" id="cooking-div">
        <h2 class="main-link-title">Cooking</h2>
      </div>
      <div class="main-link-div" id="music-div">
        <h2 class="main-link-title">Music</h2>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
 </body>
 
 </html>
