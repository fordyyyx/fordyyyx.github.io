# Builds the Astro site and publishes it to GitHub Pages.
#
# - On every push to main: build, then deploy to https://fordyyyx.github.io
# - On pull requests: build only, as a check that nothing is broken
# - Every day at 05:00 UTC: rebuild and deploy, so the live Strava chip
#   shows the latest run count
# - Can also be run by hand from the Actions tab ("Run workflow")
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# The deploy job needs permission to publish to Pages. id-token lets GitHub
# confirm the deployment really came from this repository's workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time. A running deploy is allowed to finish, and
# if several more are waiting, only the newest of them runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs the exact versions recorded in package-lock.json
      - name: Install dependencies
        run: npm ci

      # Writes src/data/strava.json for the "Runs logged on Strava" chip.
      # The secrets are set in Settings → Secrets and variables → Actions.
      # On the daily run a failed fetch stops the workflow, so the live site
      # keeps yesterday's number; on other runs the chip is just left out.
      - name: Fetch Strava stats
        run: npm run strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REQUIRED: ${{ github.event_name == 'schedule' }}

      # Runs `astro check` (types and content schemas), then `astro build`
      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Only publish from main, never from a pull request
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
