# Stat chips in the hero. Chips marked `opening: true` are shown first;
# the rest rotate in. Every stat must be true and approved for the site.
# A chip with `live:` instead of `value:` gets its number at build time
# (see "Live Strava stats" in the README); it's left out if there's no data.
# Optional extras for a chip: `icon:` (a line icon from src/icons.ts, shown
# after the value) and `entrance: charge` (bursts in from the left instead
# of fading in when it rotates into view).
